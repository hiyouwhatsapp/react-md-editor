name: Highlighted input regression
on:
  push:
    branches:
      - fix/highlighted-input-background-701

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: node -e "const fs = require('fs'); const p = require('./package.json'); p.jest.testMatch = ['<rootDir>/test/input-background.test.tsx']; fs.writeFileSync('package.json', JSON.stringify(p));"
      - run: npx tsbb test --coverage
