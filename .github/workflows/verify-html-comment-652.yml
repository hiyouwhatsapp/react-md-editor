name: Verify issue 652
on:
  push:
    branches:
      - verify/html-comment-652-20261101
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm install --no-save --ignore-scripts rehype-sanitize@6
      - run: npm ls hast-util-raw rehype-raw || true
      - run: npm test -- --runInBand test/html-comment-preview.test.tsx
