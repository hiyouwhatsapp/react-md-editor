name: Verify CI test fixes
on:
  push:
    branches:
      - fix/ci-highlighting-fixture-20261029
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: npm run coverage
