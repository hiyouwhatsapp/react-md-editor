name: Verify adaptive preview height
on:
  push:
    branches:
      - verify/preview-adaptive-height-631-20261101
jobs:
  browser-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Run existing and new unit tests
        run: npm run coverage
        continue-on-error: true
      - run: npm run build
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node test/preview-height-browser.verify.mjs
